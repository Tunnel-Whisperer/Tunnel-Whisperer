# Installed by tw (tw relay sync-tenants); do not edit.
# Enrolled servers (tenants) log in as per-tenant twt-* accounts. Their
# authorized_keys line already forces tw-tenant-request; this repeats that
# server-side and turns off every channel type a tenant does not use. Remote
# (-R) TCP forwarding stays, limited per key by permitlisten; local (-L/-W)
# forwarding is off here and pinned to a dead port by the key's permitopen.
# A tenant needs one session per connection (a request); the reverse tunnel
# itself uses none.
Match User twt-*
	ForceCommand /usr/local/lib/tw/tw-tenant-request
	AuthenticationMethods publickey
	KbdInteractiveAuthentication no
	AllowTcpForwarding remote
	GatewayPorts no
	PermitOpen none
	AllowStreamLocalForwarding no
	AllowAgentForwarding no
	X11Forwarding no
	PermitTTY no
	PermitTunnel no
	PermitUserRC no
	MaxSessions 2
