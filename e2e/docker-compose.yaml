name: tw-e2e

x-tw: &tw
  build: ./images/tw
  volumes:
    - ./shared:/shared
  networks:
    twnet: {}
  # WireGuard interface creation + tc netem for the benchmark (TestBench);
  # harmless for the ordinary e2e scenarios.
  cap_add:
    - NET_ADMIN

services:
  relay:
    build: ./images/relay
    privileged: true
    volumes:
      - ./shared:/shared
    networks:
      twnet:
        ipv4_address: 172.28.0.10
        aliases: [relay.tw.test]
  admin:
    <<: *tw
    hostname: admin
  server:
    <<: *tw
    hostname: server1
    # Benchmark source file lives in RAM so reads never touch the overlay
    # filesystem. Sized for BENCH_SIZE_GB=5 plus a 256 MiB warm-up file.
    tmpfs:
      - /bench:size=6g
  client:
    <<: *tw
    hostname: client1
    tmpfs:
      - /bench:size=64m
  server2:
    <<: *tw
    hostname: server2
  admin2:
    <<: *tw
    hostname: admin-b

networks:
  twnet:
    ipam:
      config:
        - subnet: 172.28.0.0/24
