name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Linux binary
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X github.com/tunnelwhisperer/tw/internal/version.Version=${{ github.ref_name }}" -o tw ./cmd/tw

      # The Windows binary is deliberately NOT stripped (-s -w): stripped,
      # unsigned Go binaries score worse in Defender's ML heuristics, and the
      # go-winres syso embeds a version-info resource + manifest for the same
      # reason.
      - name: Build Windows binary
        run: |
          go tool go-winres make --in cmd/tw/winres/winres.json --out cmd/tw/rsrc --arch amd64 --file-version "${{ github.ref_name }}" --product-version "${{ github.ref_name }}"
          GOOS=windows GOARCH=amd64 go build -ldflags="-X github.com/tunnelwhisperer/tw/internal/version.Version=${{ github.ref_name }}" -o tw.exe ./cmd/tw

      - name: Build macOS binary
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X github.com/tunnelwhisperer/tw/internal/version.Version=${{ github.ref_name }}" -o tw-darwin ./cmd/tw

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag (if any)
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -1)

          if [ -z "$PREV_TAG" ]; then
            # First release — use all commits
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          # Generate changelog grouped by category
          {
            echo "## What's Changed"
            echo ""

            # Collect commits and categorize
            git log "$RANGE" --pretty=format:"%s" --no-merges | while IFS= read -r msg; do
              # Skip generic messages
              case "$msg" in
                v1|"Merge "*) continue ;;
              esac
              echo "- $msg"
            done

            echo ""
            echo "---"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${GITHUB_REF_NAME}"
          } > CHANGELOG.md

          cat CHANGELOG.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            tw
            tw.exe
            tw-darwin
            CHANGELOG.md
          if-no-files-found: error

  # Gate the release on a real Windows Defender scan so a build that trips
  # Defender's heuristics never ships to users.
  defender-scan:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files

      - name: Update Defender signatures
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { Write-Warning "Signature update failed (exit $LASTEXITCODE); scanning with preinstalled signatures." }

      - name: Scan tw.exe with Windows Defender
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "$PWD\tw.exe" -DisableRemediation
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Windows Defender flagged tw.exe (MpCmdRun exit $LASTEXITCODE). Not releasing."
            exit 1
          }

  release:
    needs: [build, defender-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            tw
            tw.exe
            tw-darwin
