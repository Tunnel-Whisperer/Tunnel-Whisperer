name: e2e
# Docs-only changes skip the suite; docs/assets stays in because the video
# drift gate (e2e/video/sync_test.go) checks the committed GIFs there.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!mkdocs.yml'
      - '!**.md'
      - '!.github/workflows/docs.yml'
      - 'docs/assets/**'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!mkdocs.yml'
      - '!**.md'
      - '!.github/workflows/docs.yml'
      - 'docs/assets/**'
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make e2e
